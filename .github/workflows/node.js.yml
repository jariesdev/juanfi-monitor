name: Node.js CI

on:
  push:
    branches: [ "main", "release/*" ]
    tags: ["*"]
    paths:
      - client-pwa/**
  pull_request:
    branches: [ "main" ]
    paths:
      - client-pwa/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Environment Variables
        run: echo "${{ vars.ENV }}" >> .env

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: ./client-pwa/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./client-pwa

      - name: Type check
        run: pnpm run check
        working-directory: ./client-pwa

      - name: Build App
        run: node_modules/.bin/vite build
        working-directory: ./client-pwa

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./client-pwa/build
          retention-days: 1

  deploy:
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Build App
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.PRODUCTION_SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy to Production
        env:
          PRODUCTION_SERVER_URI: ${{ vars.PRODUCTION_SERVER_URI }}
          PRODUCTION_WORKING_DIR: ${{ vars.PRODUCTION_WORKING_DIR }}
          PRODUCTION_PM2_ID: ${{ vars.PRODUCTION_PM2_ID }}
        run: |
          tar -czf build-artifacts.tar.gz -C build .
          scp build-artifacts.tar.gz "${PRODUCTION_SERVER_URI}:${PRODUCTION_WORKING_DIR}"
          ssh "${PRODUCTION_SERVER_URI}" \
            "cd ${PRODUCTION_WORKING_DIR} && tar -xzf build-artifacts.tar.gz && pm2 restart ${PRODUCTION_PM2_ID}"
