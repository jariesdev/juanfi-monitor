# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main", "release/*" ]
    paths:
      - client-pwa/*
  pull_request:
    branches: [ "main" ]
  create:
    tags: [ "*" ]
# since we don't have UAT, staging. We do all in prod.
# ideally, main and tags are productions, release (develop -> release) is UAT and develop (features -> develop or features -> integrations -> develop) is staging
jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4

      - name: Environment Variables
        run: echo "${{ vars.ENV }}" >> .env

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./client-pwa/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./client-pwa

      - name: Build App
        run: node_modules/.bin/vite build
        working-directory: ./client-pwa

      - name: Compress Build Artifacts
        run: tar -czf build-artifacts.tar.gz build package.json
        working-directory: ./client-pwa

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./client-pwa/build-artifacts.tar.gz
          retention-days: 1

  deploy:
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Build App
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build

      - name: Deploy to Production
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PRODUCTION_SERVER_URI: ${{ vars.PRODUCTION_SERVER_URI }}
          PRODUCTION_WORKING_DIR: ${{ vars.PRODUCTION_WORKING_DIR }}
          PRODUCTION_PM2_ID: ${{ vars.PRODUCTION_PM2_ID }}
        run: |
          echo "${SSH_PRIVATE_KEY}" > ssh_key
          chmod 600 ssh_key
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.PRODUCTION_SERVER_IP }}" >> ~/.ssh/known_hosts
          scp -i ssh_key build/build-artifacts.tar.gz ${PRODUCTION_SERVER_URI}:${PRODUCTION_WORKING_DIR}
          ssh -i ssh_key ${PRODUCTION_SERVER_URI} "cd ${PRODUCTION_WORKING_DIR} && tar -xzf build-artifacts.tar.gz && pm2 restart ${PRODUCTION_PM2_ID}"
