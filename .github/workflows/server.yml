name: Go Server CI/CD

on:
  push:
    branches: ["**"]
    tags: ["*"]
    paths:
      - server/**
  pull_request:
  workflow_dispatch: 

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run tests
        run: go test ./tests/... -v -count=1

  build:
    name: Build
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build binary
        run: CGO_ENABLED=1 go build -ldflags="-s -w" -o go_app_be ./cmd

      - name: Compress artifact
        run: tar -czf server-artifacts.tar.gz go_app_be

      - uses: actions/upload-artifact@v4
        with:
          name: server-artifacts
          path: ./server/server-artifacts.tar.gz
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: server-artifacts
          path: artifact

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.PRODUCTION_SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Write server .env
        run: echo "${{ vars.SERVER_ENV }}" > server.env

      - name: Deploy to production
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PRODUCTION_SERVER_URI: ${{ vars.PRODUCTION_SERVER_URI }}
          SERVER_WORKING_DIR: ${{ vars.SERVER_WORKING_DIR }}
          SERVER_BUILD_DIR: ${{ vars.SERVER_BUILD_DIR }}
          SERVER_SERVICE_NAME: ${{ vars.SERVER_SERVICE_NAME }}
        run: |
          echo "${SSH_PRIVATE_KEY}" > ssh_key
          chmod 600 ssh_key
          scp -i ssh_key artifact/server-artifacts.tar.gz "${PRODUCTION_SERVER_URI}:${SERVER_BUILD_DIR}"
          scp -i ssh_key server.env "${PRODUCTION_SERVER_URI}:${SERVER_WORKING_DIR}/.env"
          ssh -i ssh_key "${PRODUCTION_SERVER_URI}" \
            "tar -xzf ${SERVER_BUILD_DIR}/server-artifacts.tar.gz -C ${SERVER_WORKING_DIR} && \
             sudo systemctl restart ${SERVER_SERVICE_NAME}"
